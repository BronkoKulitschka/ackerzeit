<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#213e32"><meta name="description" content="Ackerzeit – ein saisonales Farm-Managementspiel in Pixelart.">
  <title>Ackerzeit · Farm Manager</title>
  <link rel="stylesheet" href="style.css?v=0.1.1">
  <script defer src="engine.js?v=0.1.1"></script><script defer src="isometric.js?v=0.1.1"></script><script defer src="app.js?v=0.1.1"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#hof"><span class="brand-mark" aria-hidden="true">▥</span><span>ACKERZEIT<small>DEIN HOF. DEIN JAHR.</small></span></a>
    <div class="farm-label">BETRIEB 001<strong>Sonnenrain</strong><span>Kleiner Ackerbaubetrieb</span></div>
    <nav aria-label="Hauptmenü" id="nav"></nav>
    <div class="sidebar-bottom"><span>FARM MANAGER</span><strong>Version 0.1.1</strong><button class="quiet" data-view="hilfe">Spielhilfe & Spielstand</button></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div><span class="eyebrow" id="season-label"></span><h1 id="date-label"></h1></div><div class="time-controls"><button id="week" class="secondary">Bis zu 7 Tage</button><button id="next" class="primary">Nächster Tag <span aria-hidden="true">▸</span></button></div></header>
    <div class="year-strip" id="calendar" aria-label="Jahreskalender"></div>
    <div id="save-warning" class="warning" role="alert" hidden></div>
    <div class="stats" id="stats"></div>
    <main id="main"></main>
    <footer><span>ACKERZEIT <b>0.1.1</b></span><span id="save-status">Spielstand wird lokal gespeichert</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button value="cancel">Abbrechen</button><button id="confirm-ok" value="ok" class="primary">Bestätigen</button></div></form></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript>Bitte JavaScript aktivieren, um Ackerzeit zu spielen.</noscript>
</body>
</html>
